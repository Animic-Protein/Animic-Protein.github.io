<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Circulació del fragment · Còdex Viu</title><link rel="stylesheet" href="../formiga.css"><style>:root{--ink:#111317;--muted:#686d74;--line:#d9dcdf;--blue:#087dff;--ochre:#f0a51d;--green:#00c875}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 80px}.ey{font-size:.7rem;font-weight:750;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}h1{font:400 clamp(2.8rem,8vw,6rem)/.9 Georgia,serif;letter-spacing:-.045em;margin:.2em 0}.mut{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:24px;padding:18px;margin:18px 0;background:#fff}.hero{border-color:var(--green);background:linear-gradient(180deg,#fbfffd,#fff)}.origin{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.id{font:700 .72rem ui-monospace,monospace;color:var(--muted);word-break:break-all}.state{font:400 2rem Georgia,serif;margin:.2rem 0}.difference{font:400 1.25rem Georgia,serif;color:var(--ochre)}.route{display:grid;gap:10px}.organ{border:1px solid var(--line);border-radius:18px;padding:14px}.organ.active{border-color:var(--green)}.organ h2{font:400 1.35rem Georgia,serif;margin:.15rem 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.25rem .5rem;font-size:.72rem}.badge.on{border-color:var(--green);color:#075c37}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.button{display:inline-grid;place-items:center;min-height:44px;border:1px solid var(--ink);border-radius:999px;padding:.65rem .9rem;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer}.button.primary{background:var(--ink);color:#fff}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.empty h2{font:400 2rem Georgia,serif;color:var(--ink);margin:.2rem 0}.timeline{display:grid;gap:8px}.event{border-left:2px solid var(--line);padding:5px 0 5px 14px}details{margin-top:14px}summary{cursor:pointer;color:var(--muted)}@media(max-width:620px){.origin{grid-template-columns:1fr}}</style></head><body><main><a href="./" class="mut">← Cambra Nua del Temps</a><p class="ey">CÒDEX VIU · SISTEMA CIRCULATORI</p><h1>Circulació<br>del fragment.</h1><p class="mut">Aquí no es crea res nou. Només es decideix què fer amb un fragment que ja existeix.</p><section id="view"></section></main><script type="module">import{loadTemporalFragments,routeTemporalFragment,TEMPORAL_FRAGMENT_TARGETS}from'./temporal-fragment.js';const view=document.querySelector('#view');const labels={'cambra-nua-del-temps':'Cambra Nua','biblioteca-de-ressonancies':'Biblioteca de Ressonàncies','compost':'Compost','inter-nos':'INTER NOS'};const links={'cambra-nua-del-temps':'./','biblioteca-de-ressonancies':'../#ressonancia','compost':'../#compost','inter-nos':'../inter-nos-creative/#interlocutor'};function latest(rows){return [...rows].sort((a,b)=>String(b?.provenance?.createdAt||b?.source?.createdAt||'').localeCompare(String(a?.provenance?.createdAt||a?.source?.createdAt||'')))[0]}function lastTarget(r){const rel=[...(r.relation||[])].reverse().find(x=>x.kind?.startsWith('return-to-'));return rel?.target||'cambra-nua-del-temps'}function empty(){view.innerHTML='<section class="panel"><div class="empty"><p class="ey">NO HI HA CAP FRAGMENT ACTIU</p><h2>Primer ha de passar alguna cosa.</h2><p>Fes una única prova a la Cambra Nua. Quan revelis la diferència, el fragment quedarà conservat i tornaràs aquí.</p><a class="button primary" href="./espera.html?return=circulation">Entrar a Espera sense rellotge →</a></div></section>'}function render(){const rows=loadTemporalFragments();if(!rows.length){empty();return}const r=latest(rows),active=lastTarget(r),routed=new Set((r.relation||[]).map(x=>x.target));routed.add('cambra-nua-del-temps');const difference=Number(r.fragment?.difference||0);view.innerHTML=`<section class="panel hero"><p class="ey">FRAGMENT ACTIU</p><div class="origin"><div><p class="state">${difference>=0?'+':''}${difference.toFixed(1)} s de diferència percebuda</p><p class="mut">${Number(r.fragment?.chronological||0).toFixed(1)} s cronològics · ${Number(r.fragment?.perceived||0).toFixed(1)} s percebuts</p><p class="difference">Origen: Cambra Nua · Espera sense rellotge</p></div><div class="id">${r.provenance?.originId||'—'}</div></div><p class="mut">Aquest fragment és únic, reversible i no canònic. Ara només cal decidir on vols que torni.</p></section><section class="panel"><p class="ey">DECISIÓ DE RETORN</p><div class="route">${Object.keys(TEMPORAL_FRAGMENT_TARGETS).map(k=>`<article class="organ ${active===k?'active':''}"><span class="badge ${routed.has(k)?'on':''}">${active===k?'ACTIU':routed.has(k)?'PASSAT':'DISPONIBLE'}</span><h2>${labels[k]||k}</h2><p class="mut">${TEMPORAL_FRAGMENT_TARGETS[k].purpose}</p><div class="actions"><button class="button primary" data-route="${k}">Retornar aquí</button><a class="button" href="${links[k]||'#'}">Obrir l’òrgan</a></div></article>`).join('')}</div></section><details><summary>Veure rastre de circulació</summary><section class="panel"><div class="timeline">${(r.relation||[]).map(x=>`<div class="event"><strong>${x.kind}</strong><span class="mut">${x.target||'—'} · ${x.at||''}</span></div>`).join('')||'<div class="mut">Encara no hi ha retorns registrats.</div>'}</div></section></details>`;view.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{routeTemporalFragment(r.id,b.dataset.route);render();window.FormigaPont?.show?.('pont',`El mateix fragment retorna a ${labels[b.dataset.route]||b.dataset.route} sense duplicar-se.`,links[b.dataset.route]||'#','Obrir l’òrgan')})}render();</script><script src="../formiga.js"></script></body></html>
