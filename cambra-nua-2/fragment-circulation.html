<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Circulació del fragment · Còdex Viu</title><link rel="stylesheet" href="../formiga.css"><style>:root{--ink:#111317;--muted:#686d74;--line:#d9dcdf;--blue:#087dff;--ochre:#f0a51d;--green:#00c875}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 80px}.ey{font-size:.7rem;font-weight:750;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}h1{font:400 clamp(2.8rem,8vw,6rem)/.9 Georgia,serif;letter-spacing:-.045em;margin:.2em 0}.mut{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:24px;padding:18px;margin:18px 0;background:#fff}.hero{border-color:var(--green);background:linear-gradient(180deg,#fbfffd,#fff)}.origin{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.id{font:700 .72rem ui-monospace,monospace;color:var(--muted);word-break:break-all}.state{font:400 2rem Georgia,serif;margin:.2rem 0}.difference{font:400 1.25rem Georgia,serif;color:var(--ochre)}.route{display:grid;gap:10px}.organ{border:1px solid var(--line);border-radius:18px;padding:14px}.organ.active{border-color:var(--green)}.organ h2{font:400 1.35rem Georgia,serif;margin:.15rem 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.25rem .5rem;font-size:.72rem}.badge.on{border-color:var(--green);color:#075c37}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.button{display:inline-grid;place-items:center;min-height:44px;border:1px solid var(--ink);border-radius:999px;padding:.65rem .9rem;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer}.button.primary{background:var(--ink);color:#fff}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.empty h2{font:400 2rem Georgia,serif;color:var(--ink);margin:.2rem 0}.timeline{display:grid;gap:8px}.event{border-left:2px solid var(--line);padding:5px 0 5px 14px}.breath{padding:26px 18px;text-align:center;border:1px solid var(--green);border-radius:24px;background:#fbfffd}.breath p{max-width:48ch;margin:8px auto}.breath button{border:0;background:transparent;color:#087dff;cursor:pointer;padding:12px}details{margin-top:14px}summary{cursor:pointer;color:var(--muted)}@media(max-width:620px){.origin{grid-template-columns:1fr}}</style></head><body><main><a href="./" class="mut">← Cambra Nua del Temps</a><p class="ey">CÒDEX VIU · SISTEMA CIRCULATORI</p><h1>Circulació<br>del fragment.</h1><p class="mut">Aquí no es crea res nou. Una connexió disponible no exigeix ser travessada.</p><section id="view"></section></main><script type="module" src="./fragment-circulation.mjs"></script><script src="../formiga.js"></script></body></html>
